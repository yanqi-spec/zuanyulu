<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骂人宝典-小七</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 30%, #1f1b14, #0f0e0a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', '华文楷书', 'Microsoft YaHei', '楷体', serif;
            padding: 20px;
        }

        .card {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #fffaf0, #fff3e2);
            border-radius: 68px;
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .header {
            background: #2e241ae0;
            padding: 22px 28px 18px;
            text-align: center;
            border-bottom: 2px solid #e5bc7c;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #f9e0a0, #cd9f5a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .sub {
            color: #dfc799;
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .selector-area {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 20px 28px 0;
            flex-wrap: wrap;
            background: #fef7e8;
        }

        .book-option {
            flex: 1;
            min-width: 160px;
            background: #f3ebdb;
            border-radius: 60px;
            padding: 10px 12px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .book-option.active {
            background: #f5e5c8;
            border-color: #c2812e;
            box-shadow: 0 6px 14px rgba(160, 100, 20, 0.3);
        }

        .book-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1rem;
        }

        .book-status {
            font-size: 0.65rem;
            background: #d9cbaf;
            padding: 3px 8px;
            border-radius: 50px;
            color: #4e3b24;
        }

        .quote-stage {
            background: linear-gradient(135deg, #342a1f, #241e15);
            margin: 20px 28px;
            border-radius: 48px;
            padding: 30px 28px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .quote-text {
            font-size: 1.4rem;
            line-height: 1.45;
            color: #fff3df;
            text-shadow: 2px 2px 5px #00000040;
            text-align: center;
            font-family: '华文楷书', '楷体', serif;
            word-break: break-word;
        }

        .quote-meta {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #ddba7a;
            border-top: 1px dashed #cb9f5b60;
            padding-top: 16px;
        }

        .badge {
            background: #4a372490;
            padding: 4px 14px;
            border-radius: 80px;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 28px 25px;
        }

        .btn {
            border: none;
            background: #7a592f;
            padding: 12px 24px;
            border-radius: 80px;
            font-weight: bold;
            font-size: 1rem;
            color: #fef0cf;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: #b97934;
            box-shadow: 0 0 12px rgba(200, 120, 30, 0.5);
        }

        .btn-primary:hover {
            background: #cf9046;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #4d3b24;
        }

        .status-bar {
            background: #e7ddca;
            margin: 0 28px 25px;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.7rem;
            color: #835e32;
            text-align: center;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            padding: 12px 20px 20px;
            color: #b69462;
            border-top: 1px solid #ecdcaa;
            background: #fff7ea;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>📖 骂人宝典</h1>
        <div class="sub">「 一语中的 · 文雅输出 」</div>
    </div>

    <div class="selector-area">
        <div class="book-option active" id="optionLeft">
            <div class="book-label">
                <span>🔥</span> <span>火力全开</span>
            </div>
            <div class="book-status" id="leftStatus">📄 加载中</div>
        </div>
        <div class="book-option" id="optionRight">
            <div class="book-label">
                <span>🌸</span> <span>口吐芬芳</span>
            </div>
            <div class="book-status" id="rightStatus">📄 加载中</div>
        </div>
    </div>

    <div class="quote-stage">
        <div class="quote-text" id="quoteText">
            ✨ 点击下方按钮<br>从所选宝典中随机抽取金句
        </div>
        <div class="quote-meta">
            <span class="badge" id="sourceBadge">📚 未抽取</span>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="randomBtn">🎲 随机一句</button>
        <button class="btn btn-secondary" id="reloadBtn">🔄 重新加载</button>
    </div>

    <div class="status-bar" id="statusBar">
        📁 正在加载 TXT 文件...
    </div>
    <footer>
        💡 点击上方切换书籍 | 📍 <a href="https://yanqi-spec.github.io/daohanglaile/" target="_blank" style="color: #b69462; text-decoration: none; font-weight: bold;">小七导航</a>
    </footer>
</div>

<script>
    // 使用英文文件名，避免中文编码问题
    const LEFT_FILE = 'fire.txt';
    const RIGHT_FILE = 'flower.txt';

    let leftSentences = [];
    let rightSentences = [];
    let leftLoaded = false;
    let rightLoaded = false;
    let currentBook = 'left';

    const optionLeft = document.getElementById('optionLeft');
    const optionRight = document.getElementById('optionRight');
    const leftStatusSpan = document.getElementById('leftStatus');
    const rightStatusSpan = document.getElementById('rightStatus');
    const quoteTextDiv = document.getElementById('quoteText');
    const sourceBadge = document.getElementById('sourceBadge');
    const statusBar = document.getElementById('statusBar');
    const randomBtn = document.getElementById('randomBtn');
    const reloadBtn = document.getElementById('reloadBtn');

    function setStatus(msg, isError = false) {
        statusBar.innerHTML = msg;
        statusBar.style.color = isError ? '#c25a2c' : '#835e32';
    }

    function updateLeftStatus(text, isError = false) {
        leftStatusSpan.innerHTML = text;
        leftStatusSpan.style.color = isError ? '#b76539' : '#4e3b24';
    }

    function updateRightStatus(text, isError = false) {
        rightStatusSpan.innerHTML = text;
        rightStatusSpan.style.color = isError ? '#b76539' : '#4e3b24';
    }

    function highlightSelected() {
        if (currentBook === 'left') {
            optionLeft.classList.add('active');
            optionRight.classList.remove('active');
        } else {
            optionRight.classList.add('active');
            optionLeft.classList.remove('active');
        }
    }

    function extractSentences(text) {
        let sentences = text.split(/[。！？；\n\r]+/);
        let result = [];
        for (let s of sentences) {
            s = s.trim().replace(/\s+/g, ' ');
            if (s.length > 4 && s.length < 200 && 
                !/^\d+$/.test(s) &&
                !s.includes('目录') &&
                !s.includes('序言')) {
                result.push(s);
            }
        }
        return [...new Set(result)];
    }

    async function loadTxtFile(url, side) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`文件不存在 (${response.status})`);
            }
            const text = await response.text();
            const sentences = extractSentences(text);
            if (sentences.length === 0) {
                throw new Error('未找到有效句子');
            }
            return sentences;
        } catch (err) {
            console.error(`加载 ${url} 失败:`, err);
            throw err;
        }
    }

    async function loadBothBooks() {
        setStatus("⏳ 正在加载《火力全开》...");
        updateLeftStatus("⏳ 加载中");
        updateRightStatus("⏳ 待加载");
        
        try {
            leftSentences = await loadTxtFile(LEFT_FILE, 'left');
            leftLoaded = true;
            updateLeftStatus(`✅ ${leftSentences.length} 句`);
            setStatus(`✅ 《火力全开》加载完成，加载《口吐芬芳》...`);
        } catch (err) {
            leftLoaded = false;
            updateLeftStatus(`❌ 文件不存在`, true);
            setStatus(`⚠️ 请确保 ${LEFT_FILE} 文件存在`, true);
        }
        
        try {
            rightSentences = await loadTxtFile(RIGHT_FILE, 'right');
            rightLoaded = true;
            updateRightStatus(`✅ ${rightSentences.length} 句`);
            setStatus(`📚 双书加载完成 | 左:${leftSentences.length}句 右:${rightSentences.length}句`);
        } catch (err) {
            rightLoaded = false;
            updateRightStatus(`❌ 文件不存在`, true);
            setStatus(`⚠️ 请确保 ${RIGHT_FILE} 文件存在`, true);
        }
        
        if ((currentBook === 'left' && leftLoaded) || (currentBook === 'right' && rightLoaded)) {
            getRandomQuote();
        }
    }

    function getRandomQuote() {
        const isLeft = (currentBook === 'left');
        const sentences = isLeft ? leftSentences : rightSentences;
        const loaded = isLeft ? leftLoaded : rightLoaded;
        const bookName = isLeft ? '《火力全开》' : '《口吐芬芳》';
        const icon = isLeft ? '🔥' : '🌸';
        
        if (!loaded || sentences.length === 0) {
            quoteTextDiv.innerHTML = `⚠️ 请确保 ${isLeft ? LEFT_FILE : RIGHT_FILE} 文件存在`;
            sourceBadge.innerHTML = `${icon} ${bookName} · 加载失败`;
            return;
        }
        
        const randomIndex = Math.floor(Math.random() * sentences.length);
        quoteTextDiv.innerHTML = `「 ${sentences[randomIndex]} 」`;
        sourceBadge.innerHTML = `${icon} ${bookName} · 金句`;
    }

    async function retryLoad() {
        setStatus("🔄 重新加载...");
        leftLoaded = false;
        rightLoaded = false;
        updateLeftStatus("⏳ 重载中");
        updateRightStatus("⏳ 重载中");
        await loadBothBooks();
    }

    function switchToLeft() {
        if (currentBook === 'left') return;
        currentBook = 'left';
        highlightSelected();
        getRandomQuote();
    }

    function switchToRight() {
        if (currentBook === 'right') return;
        currentBook = 'right';
        highlightSelected();
        getRandomQuote();
    }

    optionLeft.addEventListener('click', switchToLeft);
    optionRight.addEventListener('click', switchToRight);
    randomBtn.addEventListener('click', getRandomQuote);
    reloadBtn.addEventListener('click', retryLoad);

    highlightSelected();
    loadBothBooks();
</script>
</body>
</html>
